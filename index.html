<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestão Elétrica</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface2: #f3f6f9;
    --surface3: #e6ebf1;
    --border: #aeb8c4;
    --border-strong: #6f7d8c;
    --text: #111827;
    --text-dim: #3f4b5a;
    --text-soft: #5f6b7a;
    --industrial-blue: #0b4f8a;
    --industrial-blue-strong: #073b68;
    --industrial-blue-soft: #dceaf7;
    --alta: #b42318;
    --alta-bg: #fde7e4;
    --media: #a15c00;
    --media-bg: #fff0d6;
    --baixa: #0b4f8a;
    --baixa-bg: #dceaf7;
    --concluida: #147a4f;
    --concluida-bg: #dff3ea;
    --accent: #0b4f8a;
    --radius: 10px;
    --shadow-card: 0 2px 8px rgba(17, 24, 39, 0.10);
    --shadow-strong: 0 6px 18px rgba(17, 24, 39, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: linear-gradient(180deg, #f7f9fb 0%, var(--bg) 100%);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    border-left: 1px solid #d2d8df;
    border-right: 1px solid #d2d8df;
  }

  .header {
    background: #ffffff;
    border-bottom: 2px solid var(--border-strong);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 10px rgba(17, 24, 39, 0.12);
  }

  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--industrial-blue-strong);
  }

  .header-date {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 700;
    background: #eef3f8;
    border: 1px solid #c4ced9;
    padding: 5px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .page { display: none; padding: 18px 18px 120px; }
  .page.active { display: block; }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(100vw, 480px);
    max-width: 480px;
    height: 78px;
    background: #ffffff;
    border-top: 2px solid var(--border-strong);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 999;
    box-shadow: 0 -4px 14px rgba(17, 24, 39, 0.10);
  }

  .bottom-item {
    flex: 1;
    height: 100%;
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: background 0.2s ease;
    color: var(--text-soft);
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
  }

  .bottom-item.active { color: var(--industrial-blue-strong); background: #edf4fb; }
  .bottom-icon { font-size: 21px; line-height: 1; }
  .bottom-icon-main {
    background: var(--industrial-blue);
    color: white;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--industrial-blue-strong);
    box-shadow: 0 4px 10px rgba(7, 59, 104, 0.18);
  }
  .bottom-label { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }

  /* TOAST */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #1e293b;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    z-index: 9999;
    opacity: 0;
    transition: all 0.3s;
    max-width: 90vw;
    text-align: center;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: #147a4f; }
  .toast.error { background: #b42318; }
  .toast.warning { background: #a15c00; }

  /* CARDS */
  .day-banner {
    background: linear-gradient(135deg, #ffffff 0%, #edf3f8 100%);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-card);
  }
  .day-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); font-weight: 800; }
  .day-count { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; color: var(--text); line-height: 1; }
  .day-count span { font-size: 13px; color: var(--text-dim); font-weight: 700; }

  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--industrial-blue-strong);
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }
  .section-label::after { content: ''; flex: 1; height: 2px; background: var(--border); }

  .task-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .task-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
  .task-card.alta::before { background: var(--alta); }
  .task-card.media::before { background: var(--media); }
  .task-card.baixa::before { background: var(--baixa); }
  .task-card.concluida::before { background: var(--concluida); }
  .task-card:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-strong); }
  .task-card.concluida { opacity: 1; background: #f5f7f9; }

  .priority-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; border: 2px solid #fff; outline: 1px solid var(--border-strong); }
  .task-card.alta .priority-dot { background: var(--alta); }
  .task-card.media .priority-dot { background: var(--media); }
  .task-card.baixa .priority-dot { background: var(--baixa); }
  .task-card.concluida .priority-dot { background: var(--concluida); }

  .task-info { flex: 1; min-width: 0; }
  .task-name { font-weight: 700; font-size: 16px; line-height: 1.3; margin-bottom: 5px; color: var(--text); }
  .task-card.concluida .task-name { text-decoration: line-through; color: var(--text-dim); }
  .task-meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 10px; flex-wrap: wrap; font-weight: 600; }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid currentColor; }
  .tag.alta { background: var(--alta-bg); color: var(--alta); }
  .tag.media { background: var(--media-bg); color: var(--media); }
  .tag.baixa { background: var(--baixa-bg); color: var(--baixa); }
  .tag.concluida { background: var(--concluida-bg); color: var(--concluida); }

  .task-check { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.2s; background: #f8fafc; color: var(--industrial-blue-strong); font-size: 16px; font-weight: 800; }
  .task-card.concluida .task-check { border-color: var(--concluida); background: var(--concluida-bg); color: var(--concluida); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.48); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { position: relative; z-index: 5001; background: #ffffff; border-radius: 18px; border: 2px solid var(--border-strong); width: 100%; max-width: 480px; max-height: calc(100vh - 40px); overflow-y: auto; padding: 24px 20px 40px; animation: slideUp 0.3s ease; box-shadow: 0 -10px 26px rgba(17, 24, 39, 0.18); }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 23px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; color: var(--industrial-blue-strong); }
  .modal-close { background: #eef3f8; border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* FORMS */
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--industrial-blue-strong); margin-bottom: 6px; font-weight: 800; }
  input, textarea, select { width: 100%; background: #ffffff; border: 2px solid var(--border); border-radius: 8px; padding: 13px 14px; color: var(--text); font-family: 'Barlow', sans-serif; font-size: 16px; font-weight: 600; outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; box-shadow: inset 0 1px 2px rgba(17, 24, 39, 0.06); }
  input::placeholder, textarea::placeholder { color: #6f7d8c; }
  input:focus, textarea:focus, select:focus { border-color: var(--industrial-blue); box-shadow: 0 0 0 3px rgba(11, 79, 138, 0.16); }
  textarea { resize: none; min-height: 90px; }

  .priority-pills { display: flex; gap: 8px; }
  .priority-pill { flex: 1; padding: 11px 4px; border-radius: 8px; border: 2px solid var(--border-strong); background: #ffffff; color: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .priority-pill.alta.selected { border-color: var(--alta); background: var(--alta-bg); color: var(--alta); }
  .priority-pill.media.selected { border-color: var(--media); background: var(--media-bg); color: var(--media); }
  .priority-pill.baixa.selected { border-color: var(--baixa); background: var(--baixa-bg); color: var(--baixa); }

  .tipo-pills { display: flex; gap: 8px; }
  .tipo-pill { flex: 1; padding: 11px 4px; border-radius: 8px; border: 2px solid var(--border-strong); background: #ffffff; color: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .tipo-pill.selected { border-color: var(--industrial-blue); background: var(--industrial-blue-soft); color: var(--industrial-blue-strong); }

  .equipe-check { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
  .func-check-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #ffffff; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  .func-check-item.selected { border-color: var(--industrial-blue); background: var(--industrial-blue-soft); }
  .func-check-item input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
    box-shadow: inset 0 1px 2px rgba(17, 24, 39, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .func-check-item input[type=checkbox]:checked {
    background: var(--industrial-blue);
    border-color: var(--industrial-blue-strong);
    box-shadow: 0 2px 8px rgba(7, 59, 104, 0.20);
  }
  .func-check-item input[type=checkbox]:checked::after {
    content: '✓';
    color: #ffffff;
    font-family: 'Barlow', sans-serif;
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
  }
  .func-check-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .func-check-tipo { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 800; }

  .btn { width: 100%; padding: 15px; border-radius: 9px; border: none; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: var(--industrial-blue); color: #ffffff; border: 2px solid var(--industrial-blue-strong); box-shadow: 0 2px 8px rgba(7, 59, 104, 0.22); }
  .btn-primary:hover { background: var(--industrial-blue-strong); }
  .btn-primary:disabled { background: #aeb8c4; border-color: #aeb8c4; cursor: not-allowed; }
  .btn-danger { background: var(--alta-bg); color: var(--alta); border: 2px solid var(--alta); margin-top: 8px; }
  .btn-secondary { background: #eef3f8; color: var(--text); border: 2px solid var(--border-strong); margin-top: 8px; }

  /* FUNCIONÁRIOS PAGE */
  .func-card { background: #ffffff; border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-card); }
  .func-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-strong); }
  .func-name { font-weight: 800; font-size: 16px; color: var(--text); }
  .func-tipo-badge { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; border-radius: 6px; border: 1px solid currentColor; }
  .func-tipo-badge.eletricista { background: var(--media-bg); color: var(--media); }
  .func-tipo-badge.ajudante { background: var(--baixa-bg); color: var(--baixa); }

  /* HISTÓRICO */
  .hist-day-block { margin-bottom: 28px; }
  .hist-day-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--industrial-blue-strong);
    padding: 14px 16px 12px;
    border: 2px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    background: var(--industrial-blue-soft);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .hist-day-header-left { display: flex; align-items: center; gap: 8px; }
  .hist-day-tasks { border: 2px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; }
  .hist-day-tasks .task-card { border-radius: 0; border-left: none; border-right: none; border-top: none; border-bottom: 1px solid var(--border); margin-bottom: 0; box-shadow: none; }
  .hist-day-tasks .task-card:last-child { border-bottom: none; }

  .btn-rdo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 7px;
    border: 2px solid var(--industrial-blue);
    background: #ffffff;
    color: var(--industrial-blue-strong);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-rdo:hover { background: var(--industrial-blue); color: #fff; }

  /* MODAL RDO */
  .rdo-header {
    border-bottom: 2px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .rdo-empresa {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--industrial-blue-strong);
  }
  .rdo-subtitulo {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .rdo-meta-row {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .rdo-meta-item { font-size: 13px; font-weight: 700; color: var(--text-dim); }
  .rdo-meta-item strong { color: var(--text); }
  .rdo-atividade-item {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    background: #f8fafc;
  }
  .rdo-atividade-nome { font-weight: 800; font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .rdo-atividade-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .rdo-atividade-equipe { font-size: 12px; color: var(--industrial-blue-strong); font-weight: 700; margin-top: 6px; }
  .rdo-rodape { margin-top: 20px; padding-top: 14px; border-top: 2px solid var(--border); font-size: 11px; color: var(--text-dim); font-weight: 700; text-align: center; letter-spacing: 1px; }

  /* DETAIL */
  .detail-field { margin-bottom: 16px; }
  .detail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--industrial-blue-strong); margin-bottom: 4px; font-weight: 800; }
  .detail-value { font-size: 16px; color: var(--text); line-height: 1.5; font-weight: 600; }
  .func-list-inline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .func-chip { background: #eef3f8; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 12px; color: var(--text); font-weight: 700; }

  .empty-state { text-align: center; padding: 44px 20px; color: var(--text-dim); background: rgba(255,255,255,.55); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; font-weight: 700; }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); font-size: 14px; font-weight: 700; }
  .transfer-badge { font-size: 10px; background: #fff7e8; color: var(--media); padding: 3px 7px; border-radius: 6px; border: 1px solid #d99432; margin-left: 6px; font-weight: 800; }
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b4f8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestão Elétrica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-title" id="headerTitle">Atividades</div>
  <div class="header-date" id="headerDate"></div>
</div>

<!-- PAGE: ATIVIDADES -->
<div class="page active" id="page-atividades">
  <div class="day-banner">
    <div>
      <div class="day-label">Hoje</div>
      <div class="day-count" id="pendingCount">0 <span>pendentes</span></div>
    </div>
    <div style="text-align:right">
      <div class="day-label">Concluídas</div>
      <div class="day-count" id="doneCount">0 <span>hoje</span></div>
    </div>
  </div>
  <div id="taskList"><div class="loading">Carregando...</div></div>
</div>

<!-- PAGE: NOVA ATIVIDADE -->
<div class="page" id="page-nova">
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:24px;">Nova Atividade</div>
  <div class="form-group">
    <label>Nome da Atividade *</label>
    <input type="text" id="newNome" placeholder="Ex: Trocar disjuntor quadro 3">
  </div>
  <div class="form-group">
    <label>Descrição / Detalhes</label>
    <textarea id="newDescricao" placeholder="Informações adicionais..."></textarea>
  </div>
  <div class="form-group">
    <label>Prioridade *</label>
    <div class="priority-pills">
      <button class="priority-pill alta" onclick="selectPriority('alta')">🔴 Alta</button>
      <button class="priority-pill media" onclick="selectPriority('media')">🟠 Média</button>
      <button class="priority-pill baixa" onclick="selectPriority('baixa')">🔵 Baixa</button>
    </div>
  </div>
  <div class="form-group">
    <label>Prazo (opcional)</label>
    <input type="date" id="newPrazo">
  </div>
  <div class="form-group">
    <label>Designar Equipe (opcional)</label>
    <div class="equipe-check" id="funcCheckList">
      <div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Carregando membros...</div>
    </div>
  </div>
  <button class="btn btn-primary" id="btnSalvarAtiv" onclick="salvarAtividade()">Salvar Atividade</button>
</div>

<!-- PAGE: EQUIPE -->
<div class="page" id="page-equipe">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:1px;">Equipe</div>

<script>
const SUPABASE_URL = 'https://etudmipuztkaaujqfsqn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0dWRtaXB1enRrYWF1anFmc3FuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjUzMDIsImV4cCI6MjA5MzcwMTMwMn0.4kTkstK_nQYwfQC0gnygLNb7Nk2AmCcUBvQk6UnIspk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentPage = 'atividades';
let selectedPriority = null;
let selectedTipo = null;
let editingFuncId = null;
let allFuncionarios = [];
let selectedFuncIds = [];

// ── DATA LOCAL CORRETA ────────────────────────────────────
// Usa a data local do dispositivo do usuário (não UTC), para evitar
// problemas de fuso horário que causavam a data errada aparecer.
function getTodayLocal() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

const TODAY = getTodayLocal();

// ── CABEÇALHO COM DATA ────────────────────────────────────
const d = new Date();
const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
document.getElementById('headerDate').textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg, type = 'success', duration = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => { el.className = 'toast'; }, duration);
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────
function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.bottom-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector(`.bottom-item[data-page="${page}"]`).classList.add('active');
  const titles = { atividades: 'Atividades', nova: 'Nova Atividade', equipe: 'Equipe', historico: 'Histórico' };
  document.getElementById('headerTitle').textContent = titles[page];
  currentPage = page;
  if (page === 'atividades') loadAtividades();
  if (page === 'nova') { resetNovaForm(); loadFuncsForForm(); }
  if (page === 'equipe') loadFuncionarios();
  if (page === 'historico') loadHistorico();
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── SELEÇÕES ──────────────────────────────────────────────
function selectPriority(p) {
  selectedPriority = p;
  document.querySelectorAll('#page-nova .priority-pill').forEach(b => b.classList.remove('selected'));
  document.querySelector(`#page-nova .priority-pill.${p}`).classList.add('selected');
}

function selectTipo(t) {
  selectedTipo = t;
  document.getElementById('tipoEletricista').classList.toggle('selected', t === 'eletricista');
  document.getElementById('tipoAjudante').classList.toggle('selected', t === 'ajudante');
}

// ── FUNCIONÁRIOS NO FORMULÁRIO ────────────────────────────
async function loadFuncsForForm() {
  const container = document.getElementById('funcCheckList');
  try {
    const { data, error } = await db.from('equipe').select('*').order('nome');
    if (error) throw error;
    allFuncionarios = data || [];
    selectedFuncIds = [];

    if (!allFuncionarios.length) {
      container.innerHTML = `
        <div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
          Nenhuma pessoa da equipe cadastrada ainda. 
          <span style="color:var(--industrial-blue);cursor:pointer;text-decoration:underline;" onclick="navigate('equipe')">Cadastrar agora →</span>
        </div>`;
      return;
    }

    container.innerHTML = allFuncionarios.map(f => `
      <div class="func-check-item" id="fci-${f.id}" onclick="toggleFunc('${f.id}')">
        <input type="checkbox" id="fc-${f.id}" onclick="event.stopPropagation(); toggleFunc('${f.id}')">
        <div>
          <div class="func-check-name">${f.nome}</div>
          <div class="func-check-tipo">${f.tipo}</div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = `<div style="color:var(--alta);font-size:13px;">Erro ao carregar: ${err.message}</div>`;
  }
}

function toggleFunc(id) {
  const idx = selectedFuncIds.indexOf(id);
  const el = document.getElementById('fci-' + id);
  const cb = document.getElementById('fc-' + id);
  if (idx === -1) {
    selectedFuncIds.push(id);
    el.classList.add('selected');
    cb.checked = true;
  } else {
    selectedFuncIds.splice(idx, 1);
    el.classList.remove('selected');
    cb.checked = false;
  }
}

// ── SALVAR ATIVIDADE ──────────────────────────────────────
async function salvarAtividade() {
  const nome = document.getElementById('newNome').value.trim();
  if (!nome) { showToast('Coloca o nome da atividade!', 'warning'); return; }
  if (!selectedPriority) { showToast('Seleciona a prioridade!', 'warning'); return; }

  const btn = document.getElementById('btnSalvarAtiv');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    const payload = {
      nome,
      descricao: document.getElementById('newDescricao').value.trim() || null,
      prioridade: selectedPriority,
      prazo: document.getElementById('newPrazo').value || null,
      data_criacao: TODAY,
      status: 'pendente'
    };

    const { data: ativ, error } = await db.from('atividades').insert(payload).select().single();
    if (error) throw error;

    if (selectedFuncIds.length) {
      const links = selectedFuncIds.map(fid => ({ atividade_id: ativ.id, funcionario_id: fid }));
      const { error: linkErr } = await db.from('atividade_equipe').insert(links);
      if (linkErr) console.warn('Erro ao vincular membros:', linkErr.message);
    }

    showToast('✅ Atividade salva com sucesso!', 'success');
    resetNovaForm();
    setTimeout(() => navigate('atividades'), 800);
  } catch (err) {
    showToast('❌ Erro: ' + err.message, 'error', 5000);
    console.error('Erro salvarAtividade:', err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar Atividade';
  }
}

function resetNovaForm() {
  document.getElementById('newNome').value = '';
  document.getElementById('newDescricao').value = '';
  document.getElementById('newPrazo').value = '';
  document.querySelectorAll('#page-nova .priority-pill').forEach(b => b.classList.remove('selected'));
  selectedPriority = null;
  selectedFuncIds = [];
}

// ── HELPERS DE LINK ────────────────────────────────────────
function getLinkEquipeId(link) {
  return link.equipe_id || link.funcionario_id || link.func_id || link.membro_id || link.pessoa_id || null;
}

function getAtividadeId(link) {
  return link.atividade_id || link.ativ_id || null;
}

async function getEquipeMap() {
  const { data, error } = await db.from('equipe').select('*').order('nome');
  if (error) throw error;
  const map = {};
  (data || []).forEach(p => { map[p.id] = p; });
  return { lista: data || [], map };
}

async function getLinksAtividades() {
  const { data, error } = await db.from('atividade_equipe').select('*');
  if (error) throw error;
  return data || [];
}

function equipeDaAtividade(atividadeId, links, equipeMap) {
  return (links || [])
    .filter(l => getAtividadeId(l) === atividadeId)
    .map(l => equipeMap[getLinkEquipeId(l)])
    .filter(Boolean);
}

// ── LOAD ATIVIDADES ───────────────────────────────────────
// Regras:
//   - Pendentes: qualquer data de criação (transferidas de dias anteriores aparecem)
//   - Concluídas no dashboard: SOMENTE as de hoje (data_conclusao === TODAY)
//   - Atividades concluídas em outros dias NÃO aparecem aqui — ficam apenas no histórico
async function loadAtividades() {
  const container = document.getElementById('taskList');
  container.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    // Pendentes de qualquer data (não concluídas)
    const { data: pendentes, error: e1 } = await db
      .from('atividades')
      .select('*')
      .neq('status', 'concluida')
      .order('criado_em', { ascending: true });
    if (e1) throw e1;

    // Concluídas SOMENTE hoje
    const { data: concluidasHoje, error: e2 } = await db
      .from('atividades')
      .select('*')
      .eq('status', 'concluida')
      .eq('data_conclusao', TODAY)
      .order('data_conclusao', { ascending: false });
    if (e2) throw e2;

    const { map: equipeMap } = await getEquipeMap();
    const links = await getLinksAtividades();

    const priorityOrder = { alta: 0, media: 1, baixa: 2 };
    (pendentes || []).sort((a, b) => (priorityOrder[a.prioridade] ?? 9) - (priorityOrder[b.prioridade] ?? 9));

    const totalPendentes = (pendentes || []).length;
    const totalConcluidas = (concluidasHoje || []).length;

    document.getElementById('pendingCount').innerHTML = `${totalPendentes} <span>pendentes</span>`;
    document.getElementById('doneCount').innerHTML = `${totalConcluidas} <span>hoje</span>`;

    const prioLabels = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
    let htmlOut = '';

    if (!totalPendentes && !totalConcluidas) {
      htmlOut = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">Nenhuma atividade por hoje!</div></div>';
    }

    if (totalPendentes) {
      htmlOut += '<div class="section-label">Pendentes</div>';
      htmlOut += (pendentes || []).map(t => {
        const funcs = equipeDaAtividade(t.id, links, equipeMap).map(p => p.nome).filter(Boolean);
        // Atividades criadas em dias anteriores ganham badge "transferida"
        const transferida = t.data_criacao < TODAY;
        return `
          <div class="task-card ${t.prioridade}" onclick="openDetalhe('${t.id}')">
            <div class="priority-dot"></div>
            <div class="task-info">
              <div class="task-name">${t.nome}${transferida ? '<span class="transfer-badge">↩ transferida</span>' : ''}</div>
              <div class="task-meta">
                <span class="tag ${t.prioridade}">${prioLabels[t.prioridade] || t.prioridade || 'Prioridade'}</span>
                ${t.prazo ? `<span>📅 ${formatDate(t.prazo)}</span>` : ''}
                ${funcs.length ? `<span>👷 ${funcs.join(', ')}</span>` : ''}
              </div>
            </div>
            <div class="task-check" onclick="event.stopPropagation();concluirAtividade('${t.id}')">✓</div>
          </div>`;
      }).join('');
    }

    if (totalConcluidas) {
      htmlOut += '<div class="section-label" style="margin-top:24px">Concluídas hoje</div>';
      htmlOut += (concluidasHoje || []).map(t => {
        const funcs = equipeDaAtividade(t.id, links, equipeMap).map(p => p.nome).filter(Boolean);
        return `
          <div class="task-card concluida" onclick="openDetalhe('${t.id}')">
            <div class="priority-dot"></div>
            <div class="task-info">
              <div class="task-name">${t.nome}</div>
              <div class="task-meta">
                <span class="tag concluida">Concluída</span>
                ${funcs.length ? `<span>👷 ${funcs.join(', ')}</span>` : ''}
              </div>
            </div>
            <div class="task-check" style="border-color:var(--concluida);background:var(--concluida-bg);color:var(--concluida)">✓</div>
          </div>`;
      }).join('');
    }

    container.innerHTML = htmlOut;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Erro ao carregar: ${err.message}</div></div>`;
    console.error('loadAtividades:', err);
  }
}

// ── CONCLUIR ATIVIDADE ────────────────────────────────────
// Grava data_conclusao com a data LOCAL do dispositivo para evitar
// problema de fuso horário (UTC vs horário de Brasília).
async function concluirAtividade(id) {
  try {
    const dataConc = getTodayLocal(); // data local correta
    const { error } = await db
      .from('atividades')
      .update({ status: 'concluida', data_conclusao: dataConc })
      .eq('id', id);
    if (error) throw error;
    showToast('✅ Atividade concluída!', 'success');
    loadAtividades();
  } catch (err) {
    showToast('❌ Erro: ' + err.message, 'error');
  }
}

// ── DETALHE ATIVIDADE ─────────────────────────────────────
async function openDetalhe(id) {
  try {
    const { data: t, error } = await db
      .from('atividades')
      .select('*')
      .eq('id', id)
      .single();
    if (error) throw error;

    const { map: equipeMap } = await getEquipeMap();
    const links = await getLinksAtividades();
    const funcs = equipeDaAtividade(t.id, links, equipeMap);
    const prioLabels = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };

    document.getElementById('modalDetalheContent').innerHTML = `
      <div class="detail-field">
        <div class="detail-label">Atividade</div>
        <div class="detail-value" style="font-size:18px;">${t.nome}</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Prioridade</div>
        <span class="tag ${t.prioridade}">${prioLabels[t.prioridade] || t.prioridade || 'Prioridade'}</span>
      </div>
      ${t.descricao ? `<div class="detail-field"><div class="detail-label">Descrição</div><div class="detail-value">${t.descricao}</div></div>` : ''}
      ${t.prazo ? `<div class="detail-field"><div class="detail-label">Prazo</div><div class="detail-value">📅 ${formatDate(t.prazo)}</div></div>` : ''}
      <div class="detail-field">
        <div class="detail-label">Status</div>
        <span class="tag ${t.status === 'concluida' ? 'concluida' : t.prioridade}">${t.status === 'concluida' ? 'Concluída' : 'Pendente'}</span>
      </div>
      <div class="detail-field">
        <div class="detail-label">Criada em</div>
        <div class="detail-value">${formatDate(t.data_criacao)}</div>
      </div>
      ${t.data_conclusao ? `<div class="detail-field"><div class="detail-label">Concluída em</div><div class="detail-value">${formatDate(t.data_conclusao)}</div></div>` : ''}
      ${funcs.length ? `
        <div class="detail-field">
          <div class="detail-label">Equipe</div>
          <div class="func-list-inline">
            ${funcs.map(f => `<span class="func-chip">👷 ${f.nome} <span style="opacity:.6;font-size:10px">(${f.tipo || ''})</span></span>`).join('')}
          </div>
        </div>` : ''}
      <div style="margin-top:20px;display:flex;flex-direction:column;gap:8px">
        ${t.status !== 'concluida' ? `<button class="btn btn-primary" onclick="concluirAtividade('${t.id}');closeModal('modalDetalhe')">✓ Marcar como Concluída</button>` : ''}
        <button class="btn btn-secondary" onclick="closeModal('modalDetalhe');editarPrioridade('${t.id}','${t.prioridade}')">✏️ Editar Prioridade</button>
        <button class="btn btn-danger" onclick="deletarAtividade('${t.id}')">🗑 Excluir Atividade</button>
      </div>`;
    openModal('modalDetalhe');
  } catch (err) {
    showToast('❌ Erro ao abrir detalhes: ' + err.message, 'error');
  }
}

async function editarPrioridade(id, atual) {
  const nova = prompt(`Prioridade atual: ${atual}\nDigite a nova:\n- alta\n- media\n- baixa`);
  if (nova && ['alta','media','baixa'].includes(nova.toLowerCase().trim())) {
    const { error } = await db.from('atividades').update({ prioridade: nova.toLowerCase().trim() }).eq('id', id);
    if (error) { showToast('❌ Erro: ' + error.message, 'error'); return; }
    showToast('✅ Prioridade atualizada!', 'success');
    loadAtividades();
  }
}

async function deletarAtividade(id) {
  if (!confirm('Excluir esta atividade?')) return;
  try {
    await db.from('atividade_equipe').delete().eq('atividade_id', id);
    const { error } = await db.from('atividades').delete().eq('id', id);
    if (error) throw error;
    showToast('🗑 Atividade excluída', 'success');
    closeModal('modalDetalhe');
    loadAtividades();
  } catch (err) {
    showToast('❌ Erro: ' + err.message, 'error');
  }
}

// ── FUNCIONÁRIOS ──────────────────────────────────────────
async function loadFuncionarios() {
  const container = document.getElementById('funcList');
  container.innerHTML = '<div class="loading">Carregando...</div>';
  try {
    const { data, error } = await db.from('equipe').select('*').order('nome');
    if (error) throw error;

    if (!data?.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">👷</div><div class="empty-text">Nenhuma pessoa da equipe cadastrada ainda</div></div>`;
      return;
    }

    const eletricistas = data.filter(f => f.tipo === 'eletricista');
    const ajudantes = data.filter(f => f.tipo === 'ajudante');
    let html = '';
    if (eletricistas.length) {
      html += '<div class="section-label">Eletricistas</div>';
      html += eletricistas.map(f => funcCard(f)).join('');
    }
    if (ajudantes.length) {
      html += '<div class="section-label">Ajudantes</div>';
      html += ajudantes.map(f => funcCard(f)).join('');
    }
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Erro: ${err.message}</div></div>`;
    console.error('loadFuncionarios:', err);
  }
}

function funcCard(f) {
  return `
    <div class="func-card" onclick="editarFuncionario('${f.id}','${escapeQ(f.nome)}','${f.tipo}','${escapeQ(f.info_extra||'')}')">
      <div>
        <div class="func-name">${f.nome}</div>
        ${f.info_extra ? `<div style="font-size:12px;color:var(--text-dim);margin-top:2px">${f.info_extra}</div>` : ''}
      </div>
      <span class="func-tipo-badge ${f.tipo}">${f.tipo}</span>
    </div>`;
}

function escapeQ(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function openModalFuncionario() {
  editingFuncId = null;
  document.getElementById('funcModalTitle').textContent = 'Novo Membro';
  document.getElementById('funcNome').value = '';
  document.getElementById('funcInfo').value = '';
  document.getElementById('btnDeletarFunc').style.display = 'none';
  document.getElementById('btnSalvarFunc').textContent = 'Salvar';
  document.getElementById('btnSalvarFunc').disabled = false;
  selectedTipo = null;
  document.getElementById('tipoEletricista').classList.remove('selected');
  document.getElementById('tipoAjudante').classList.remove('selected');
  openModal('modalFuncionario');
}

function editarFuncionario(id, nome, tipo, info) {
  editingFuncId = id;
  document.getElementById('funcModalTitle').textContent = 'Editar Membro';
  document.getElementById('funcNome').value = nome;
  document.getElementById('funcInfo').value = info;
  document.getElementById('btnDeletarFunc').style.display = 'block';
  document.getElementById('btnSalvarFunc').textContent = 'Salvar Alterações';
  document.getElementById('btnSalvarFunc').disabled = false;
  selectedTipo = tipo;
  document.getElementById('tipoEletricista').classList.toggle('selected', tipo === 'eletricista');
  document.getElementById('tipoAjudante').classList.toggle('selected', tipo === 'ajudante');
  openModal('modalFuncionario');
}

async function salvarFuncionario() {
  const nome = document.getElementById('funcNome').value.trim();
  if (!nome) { showToast('Coloca o nome da pessoa!', 'warning'); return; }
  if (!selectedTipo) { showToast('Seleciona a função (Eletricista ou Ajudante)!', 'warning'); return; }

  const btn = document.getElementById('btnSalvarFunc');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    const payload = {
      nome,
      tipo: selectedTipo,
      info_extra: document.getElementById('funcInfo').value.trim() || null
    };

    let error;
    if (editingFuncId) {
      ({ error } = await db.from('equipe').update(payload).eq('id', editingFuncId));
    } else {
      ({ error } = await db.from('equipe').insert(payload));
    }

    if (error) throw error;

    showToast(editingFuncId ? '✅ Membro atualizado!' : '✅ Membro cadastrado!', 'success');
    closeModal('modalFuncionario');
    loadFuncionarios();
  } catch (err) {
    showToast('❌ Erro ao salvar: ' + err.message, 'error', 6000);
    console.error('salvarFuncionario:', err);
    btn.disabled = false;
    btn.textContent = editingFuncId ? 'Salvar Alterações' : 'Salvar';
  }
}

async function deletarFuncionario() {
  if (!confirm('Excluir este membro?')) return;
  try {
    const { error } = await db.from('equipe').delete().eq('id', editingFuncId);
    if (error) throw error;
    showToast('🗑 Membro excluído', 'success');
    closeModal('modalFuncionario');
    loadFuncionarios();
  } catch (err) {
    showToast('❌ Erro: ' + err.message, 'error');
  }
}

// ── HISTÓRICO ─────────────────────────────────────────────
// Usa data_conclusao para agrupar. Cada grupo tem botão "Criar RDO".
async function loadHistorico() {
  const container = document.getElementById('histList');
  container.innerHTML = '<div class="loading">Carregando...</div>';
  try {
    const { data, error } = await db
      .from('atividades')
      .select('*')
      .eq('status', 'concluida')
      .not('data_conclusao', 'is', null)
      .order('data_conclusao', { ascending: false });
    if (error) throw error;

    if (!data?.length) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-text">Nenhuma atividade concluída ainda</div></div>';
      return;
    }

    const { map: equipeMap } = await getEquipeMap();
    const links = await getLinksAtividades();

    // Agrupa por data_conclusao (data real de quando foi concluída)
    const grouped = {};
    data.forEach(t => {
      const key = t.data_conclusao; // usa data_conclusao real
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(t);
    });

    let htmlOut = '';
    Object.keys(grouped).sort().reverse().forEach(date => {
      const tarefas = grouped[date];
      const isToday = date === TODAY;
      const dateLabel = isToday ? `Hoje — ${formatDate(date)}` : formatDate(date);

      // Serializa IDs para o botão RDO
      const idsJson = JSON.stringify(tarefas.map(t => t.id)).replace(/"/g, '&quot;');

      htmlOut += `
        <div class="hist-day-block">
          <div class="hist-day-header">
            <div class="hist-day-header-left">
              <span>📅 ${dateLabel}</span>
              <span style="background:var(--concluida-bg);color:var(--concluida);border:1px solid var(--concluida);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;">${tarefas.length} ativ.</span>
            </div>
            <button class="btn-rdo" onclick="abrirRDO('${date}', ${idsJson})">📄 RDO</button>
          </div>
          <div class="hist-day-tasks">
            ${tarefas.map(t => {
              const funcs = equipeDaAtividade(t.id, links, equipeMap).map(p => p.nome).filter(Boolean);
              return `
                <div class="task-card concluida" onclick="openDetalhe('${t.id}')">
                  <div class="priority-dot"></div>
                  <div class="task-info">
                    <div class="task-name">${t.nome}</div>
                    <div class="task-meta">
                      ${funcs.length ? `<span>👷 ${funcs.join(', ')}</span>` : ''}
                    </div>
                  </div>
                  <div class="task-check" style="border-color:var(--concluida);background:var(--concluida-bg);color:var(--concluida)">✓</div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    });
    container.innerHTML = htmlOut;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Erro: ${err.message}</div></div>`;
  }
}

// ── RDO ───────────────────────────────────────────────────
async function abrirRDO(date, ids) {
  try {
    // Busca as atividades do dia
    const { data: tarefas, error } = await db
      .from('atividades')
      .select('*')
      .in('id', ids);
    if (error) throw error;

    const { map: equipeMap } = await getEquipeMap();
    const links = await getLinksAtividades();

    // Coleta toda a equipe que trabalhou nesse dia
    const equipeDoDia = new Map();
    tarefas.forEach(t => {
      equipeDaAtividade(t.id, links, equipeMap).forEach(f => {
        equipeDoDia.set(f.id, f);
      });
    });
    const membrosUnicos = [...equipeDoDia.values()];

    const prioLabels = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };

    const html = `
      <div class="rdo-header">
        <div class="rdo-empresa">⚡ Gestão Elétrica</div>
        <div class="rdo-subtitulo">Relatório Diário de Obra — RDO</div>
        <div class="rdo-meta-row">
          <div class="rdo-meta-item">📅 <strong>${formatDate(date)}</strong></div>
          <div class="rdo-meta-item">✅ <strong>${tarefas.length}</strong> atividade(s) concluída(s)</div>
          ${membrosUnicos.length ? `<div class="rdo-meta-item">👷 <strong>${membrosUnicos.length}</strong> membro(s)</div>` : ''}
        </div>
        ${membrosUnicos.length ? `
          <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;">
            ${membrosUnicos.map(f => `<span class="func-chip">👷 ${f.nome} <span style="opacity:.6;font-size:10px">(${f.tipo})</span></span>`).join('')}
          </div>` : ''}
      </div>

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--industrial-blue-strong);margin-bottom:12px;">
        Atividades Realizadas
      </div>

      ${tarefas.map((t, i) => {
        const funcs = equipeDaAtividade(t.id, links, equipeMap);
        return `
          <div class="rdo-atividade-item">
            <div class="rdo-atividade-nome">${i + 1}. ${t.nome}</div>
            ${t.descricao ? `<div class="rdo-atividade-desc">${t.descricao}</div>` : ''}
            ${funcs.length ? `<div class="rdo-atividade-equipe">👷 ${funcs.map(f => f.nome).join(', ')}</div>` : ''}
            <div style="margin-top:6px;">
              <span class="tag ${t.prioridade}" style="font-size:10px;">${prioLabels[t.prioridade] || t.prioridade}</span>
            </div>
          </div>`;
      }).join('')}

      <div class="rdo-rodape">
        Gerado automaticamente em ${new Date().toLocaleString('pt-BR')} • Gestão Elétrica
      </div>`;

    document.getElementById('modalRDOContent').innerHTML = html;
    openModal('modalRDO');
  } catch (err) {
    showToast('❌ Erro ao gerar RDO: ' + err.message, 'error');
  }
}

function imprimirRDO() {
  window.print();
}

// ── UTILS ─────────────────────────────────────────────────
function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

loadAtividades();
